<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Akunga — Premium Commerce. Redefined.</title>
    <meta name="title" content="Akunga — Premium Commerce. Redefined." />
    <meta name="description" content="Discover premium products designed for the modern lifestyle. From cutting-edge audio to precision-engineered gear — every item curated for excellence." />
    <meta name="keywords" content="premium electronics, headphones, smartwatch, audio, wearables, online store, ecommerce" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0c8ee7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akunga" />
    <meta property="og:title" content="Akunga — Premium Commerce. Redefined." />
    <meta property="og:description" content="Discover premium products designed for the modern lifestyle. From cutting-edge audio to precision-engineered gear." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akunga — Premium Commerce. Redefined." />
    <meta name="twitter:description" content="Discover premium products designed for the modern lifestyle." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&q=80" />

    <!-- Canonical -->
    <link rel="canonical" href="https://akunga.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Akunga",
        "description": "Premium Commerce. Redefined.",
        "url": "https://akunga.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://akunga.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Preload critical assets -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
