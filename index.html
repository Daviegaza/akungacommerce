<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary meta (Fungua is a proposed name, pending trademark and domain clearance) -->
    <title>Fungua — Open commerce. Everywhere.</title>
    <meta name="title" content="Fungua — Open commerce. Everywhere." />
    <meta name="description" content="Fungua is a commerce operating system: sell through your own storefront, social channels and in person, and run products, orders, inventory, customers, payments and fulfilment from one workspace." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fungua" />
    <meta property="og:title" content="Fungua — Open commerce. Everywhere." />
    <meta property="og:description" content="Storefronts, social selling and in-person sales, with orders, stock, customers, payments and fulfilment in one workspace." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fungua — Open commerce. Everywhere." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fungua — Open commerce. Everywhere." />
    <meta name="twitter:description" content="Storefronts, social selling and in-person sales, run from one workspace." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: Geist (UI) and Geist Mono (figures), both SIL Open Font License -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
